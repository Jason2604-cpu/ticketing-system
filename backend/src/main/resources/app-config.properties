# =============================================================================
#  Konoha HelpDesk — application parameters
#
#  Edit THIS file to tune behaviour. Secrets stay in .env (never here).
#  Every key is validated on startup (see config/AppProperties.java); an
#  invalid value stops the app with a clear message instead of silently
#  misbehaving.
#
#  ${VAR:default} = reads VAR from .env / environment, else uses default.
# =============================================================================


# ──────────────────────────────────────────────────────────────────────────────
#  SECURITY
# ──────────────────────────────────────────────────────────────────────────────

# JWT ----------------------------------------------------------------------
# Secret MUST be >= 32 bytes. The dev fallback below is rejected when the
# "prod" profile is active. Set JWT_SECRET in .env for anything real.
app.security.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-32-bytes-min}
# Session length in ms (86400000 = 24h)
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Auth cookie ----------------------------------------------------------------
app.security.cookie.name=jwt
# true everywhere except plain-http localhost dev (application-dev.properties sets false)
app.security.cookie.secure=${COOKIE_SECURE:true}
# Lax = cookie not sent on cross-site POST (CSRF protection). Strict = never cross-site.
app.security.cookie.same-site=Lax

# CORS -----------------------------------------------------------------------
# Comma-separated list of frontend origins allowed to call the API with cookies.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.security.cors.allowed-headers=Content-Type,Accept,X-Requested-With
app.security.cors.allow-credentials=true
app.security.cors.max-age-seconds=3600

# Rate limiting (sliding window) ----------------------------------------------
# requests-per-minute is counted per signed-in user, and per client IP for anonymous requests.
app.security.rate-limit.enabled=true
app.security.rate-limit.requests-per-minute=120
# Applies to login, activate, forgot-password and reset-password.
app.security.rate-limit.login-attempts-per-minute=10
# Only set true when running behind a reverse proxy / load balancer YOU control.
app.security.rate-limit.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}

# Account lockout after repeated failed logins (per email) -------------------
app.security.login-lockout.enabled=true
app.security.login-lockout.max-failed-attempts=5
app.security.login-lockout.lock-minutes=15

# Password policy (applies to change-password) --------------------------------
app.security.password.min-length=10
app.security.password.max-length=128
app.security.password.require-uppercase=true
app.security.password.require-lowercase=true
app.security.password.require-digit=true
app.security.password.require-special=true

# One-time email tokens (activation / password reset) -------------------------
app.security.tokens.invite-ttl-hours=72
app.security.tokens.reset-ttl-minutes=30

# HTTP security headers -------------------------------------------------------
app.security.headers.hsts-enabled=true
app.security.headers.hsts-max-age-seconds=31536000
app.security.headers.hsts-include-subdomains=true
app.security.headers.content-security-policy=default-src 'none'; frame-ancestors 'none'


# ──────────────────────────────────────────────────────────────────────────────
#  FIRST ADMIN
# ──────────────────────────────────────────────────────────────────────────────

# Nothing to configure. On first startup (no ADMIN in the database) the backend creates
# admin@admin.com / admin and forces a password change at first sign-in — see
# config/AdminBootstrap.java. No credentials live in .env.


# ──────────────────────────────────────────────────────────────────────────────
#  EMAIL  (SMTP credentials live in .env: MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD)
# ──────────────────────────────────────────────────────────────────────────────

# false = don't send; the full email is printed to the log instead (dev).
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:Konoha HelpDesk <no-reply@localhost>}
app.mail.app-name=Konoha HelpDesk
# The React app's public URL — activation / reset links are built from this.
app.mail.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.mail.activate-path=/activate
app.mail.reset-password-path=/reset-password


# ──────────────────────────────────────────────────────────────────────────────
#  MEDIA (profile photos, company logos, later ticket attachments)
# ──────────────────────────────────────────────────────────────────────────────

# Folder on disk. Files are stored as <base-path>/<kind>/<uuid>.<ext>; the
# original filename is never used for the path. Absolute or relative to the
# working directory. Created automatically.
app.media.base-path=${MEDIA_PATH:./media}
app.media.max-file-size-mb=5
# Checked against the file's actual bytes, not the extension the client sends.
app.media.allowed-image-types=image/jpeg,image/png,image/webp
# Ticket attachments
app.media.max-attachment-size-mb=20
app.media.allowed-attachment-types=image/jpeg,image/png,image/webp,application/pdf,text/csv,text/plain
app.media.max-attachments-per-ticket=10
# Knowledge Base: images and files per article (same size/type rules as ticket attachments).
app.media.max-attachments-per-article=30


# ──────────────────────────────────────────────────────────────────────────────
#  ASSETS
# ──────────────────────────────────────────────────────────────────────────────

# An asset whose warranty ends within this many days reads as EXPIRING_SOON. Display
# and filtering only — never written to a row, so changing it re-labels everything on
# the next request instead of needing a backfill.
app.assets.expiring-soon-days=30
# Lead time used when a per-asset warranty reminder is switched on without one.
app.assets.default-reminder-days=30
# Daily warranty sweep (phase 8 — the monitor bean isn't written yet).
app.assets.monitor-enabled=true
app.assets.warranty-check-interval-ms=86400000
app.assets.initial-delay-ms=120000
# Ceiling on rows accepted in one CSV import (phase 4).
app.assets.import-max-rows=1000


# ──────────────────────────────────────────────────────────────────────────────
#  SUBSCRIPTION PLANS
# ──────────────────────────────────────────────────────────────────────────────

# Seeding: create the features/plans below if missing. Admin edits made in the
# UI are preserved unless overwrite-seeded-plans=true.
app.subscription.seed-on-startup=true
app.subscription.overwrite-seeded-plans=false

# Feature catalog (code is the stable key used by hasFeature() checks) --------
app.subscription.features[0].code=TICKET_MANAGEMENT
app.subscription.features[0].name=Ticket Management
app.subscription.features[1].code=SLA_MANAGEMENT
app.subscription.features[1].name=SLA Management
app.subscription.features[2].code=AUTOMATION_RULES
app.subscription.features[2].name=Automation Rules
app.subscription.features[3].code=KNOWLEDGE_BASE
app.subscription.features[3].name=Knowledge Base
app.subscription.features[4].code=REPORTING
app.subscription.features[4].name=Reporting
app.subscription.features[5].code=AUDIT_LOGS
app.subscription.features[5].name=Audit Logs
app.subscription.features[6].code=ASSET_MANAGEMENT
app.subscription.features[6].name=Asset Management
app.subscription.features[7].code=AI_FEATURES
app.subscription.features[7].name=AI Features (future)

# Predefined plans -------------------------------------------------------------
# SLA keys: critical, high, normal (map to SlaPriority). Times are in minutes.

app.subscription.plans[0].name=Starter
app.subscription.plans[0].description=Basic ticket management, limited users, limited monthly tickets, basic SLA.
app.subscription.plans[0].features=TICKET_MANAGEMENT
app.subscription.plans[0].limits.max-users=10
app.subscription.plans[0].limits.monthly-ticket-limit=200
app.subscription.plans[0].limits.storage-limit-mb=1024
app.subscription.plans[0].sla.critical.response-minutes=240
app.subscription.plans[0].sla.critical.resolution-minutes=1440
app.subscription.plans[0].sla.high.response-minutes=480
app.subscription.plans[0].sla.high.resolution-minutes=2880
app.subscription.plans[0].sla.normal.response-minutes=1440
app.subscription.plans[0].sla.normal.resolution-minutes=4320

app.subscription.plans[1].name=Professional
app.subscription.plans[1].description=Advanced dashboard, knowledge base, automation rules, SLA management, reporting.
app.subscription.plans[1].features=TICKET_MANAGEMENT,SLA_MANAGEMENT,AUTOMATION_RULES,KNOWLEDGE_BASE,REPORTING,ASSET_MANAGEMENT
app.subscription.plans[1].limits.max-users=100
app.subscription.plans[1].limits.monthly-ticket-limit=2500
app.subscription.plans[1].limits.storage-limit-mb=10240
app.subscription.plans[1].sla.critical.response-minutes=60
app.subscription.plans[1].sla.critical.resolution-minutes=480
app.subscription.plans[1].sla.high.response-minutes=240
app.subscription.plans[1].sla.high.resolution-minutes=1440
app.subscription.plans[1].sla.normal.response-minutes=480
app.subscription.plans[1].sla.normal.resolution-minutes=2880

app.subscription.plans[2].name=Enterprise
app.subscription.plans[2].description=All features enabled, higher limits, advanced SLA configuration.
app.subscription.plans[2].features=*
app.subscription.plans[2].limits.max-users=1000
app.subscription.plans[2].limits.monthly-ticket-limit=50000
app.subscription.plans[2].limits.storage-limit-mb=102400
app.subscription.plans[2].sla.critical.response-minutes=30
app.subscription.plans[2].sla.critical.resolution-minutes=360
app.subscription.plans[2].sla.high.response-minutes=120
app.subscription.plans[2].sla.high.resolution-minutes=720
app.subscription.plans[2].sla.normal.response-minutes=240
app.subscription.plans[2].sla.normal.resolution-minutes=1440

# Defaults pre-filled when an admin picks "Custom Plan" -------------------------
app.subscription.custom-defaults.max-users=50
app.subscription.custom-defaults.monthly-ticket-limit=1000
app.subscription.custom-defaults.storage-limit-mb=5120
app.subscription.custom-default-sla.critical.response-minutes=60
app.subscription.custom-default-sla.critical.resolution-minutes=480
app.subscription.custom-default-sla.high.response-minutes=240
app.subscription.custom-default-sla.high.resolution-minutes=1440
app.subscription.custom-default-sla.normal.response-minutes=480
app.subscription.custom-default-sla.normal.resolution-minutes=2880

# Hard upper bounds accepted from the admin UI (input-validation guardrails) ----
app.subscription.caps.max-users=100000
app.subscription.caps.monthly-ticket-limit=10000000
app.subscription.caps.storage-limit-mb=10485760
app.subscription.caps.sla-response-minutes=43200
app.subscription.caps.sla-resolution-minutes=129600

# SLA breach monitor -----------------------------------------------------------
# Background sweep that marks tickets past their response/resolution deadline and
# escalates once per breach. Disable the sweep with app.sla.monitor-enabled=false.
app.sla.monitor-enabled=${SLA_MONITOR_ENABLED:true}
app.sla.check-interval-ms=${SLA_CHECK_INTERVAL_MS:300000}
app.sla.batch-size=200
app.sla.at-risk-percent=80
app.sla.email-assignee=true
app.sla.email-main-engineer=true
app.sla.escalate-to-admins-for-priorities=CRITICAL,HIGH

# ─────────────────────────────────────────────────────────────────────────────
# Service contracts (app.contracts.*)
#
# Recurring obligations to a customer — preventive maintenance schedules, support
# retainers, annual certifications. Each contract's occurrences are generated as
# dated visit rows; a daily sweep raises the maintenance ticket ahead of a visit
# (only for contracts with auto-ticketing switched on) and mails renewal reminders.
# Disable the whole sweep with app.contracts.monitor-enabled=false.
# ─────────────────────────────────────────────────────────────────────────────
app.contracts.monitor-enabled=${CONTRACT_MONITOR_ENABLED:true}
app.contracts.check-interval-ms=${CONTRACT_CHECK_INTERVAL_MS:86400000}
# Delay before the first sweep after start-up, so it doesn't fight the boot seeders.
app.contracts.initial-delay-ms=120000
# A contract within this many days of its end date shows as "Expiring soon".
app.contracts.expiring-soon-days=60
# Ceiling on a contract's own ticket lead time, and the sweep's look-ahead horizon.
app.contracts.max-ticket-lead-days=90
# Safety valve: most visits one sweep may raise tickets for.
app.contracts.batch-size=100
app.contracts.email-renewal-reminders=true

# ─────────────────────────────────────────────────────────────────────────────
# Audit trail (app.audit.*)
#
# Every AuditLogger event is written both to the "AUDIT" slf4j logger and to the
# audit_events table that backs the admin viewer. The table only grows, so the
# retention prune runs daily; set retention-days=0 to keep everything forever
# (only if something else archives the table).
# ─────────────────────────────────────────────────────────────────────────────
app.audit.retention-days=${AUDIT_RETENTION_DAYS:365}
app.audit.prune-interval-ms=86400000
app.audit.max-page-size=200
app.audit.max-export-rows=20000

# ─────────────────────────────────────────────────────────────────────────────
# Automation (app.automation.*)
#
# Scheduled, customer-facing emails for companies whose plan includes AUTOMATION_RULES.
# The monthly ticket summary goes to each company's Customer Admins on the day the company
# chose (default the 1st), once per month. Disable the whole sweep with
# app.automation.monitor-enabled=false.
# ─────────────────────────────────────────────────────────────────────────────
app.automation.monitor-enabled=${AUTOMATION_MONITOR_ENABLED:true}
app.automation.check-interval-ms=${AUTOMATION_CHECK_INTERVAL_MS:3600000}
app.automation.initial-delay-ms=180000
app.automation.zone=${AUTOMATION_ZONE:Asia/Kuala_Lumpur}
app.automation.send-hour=8
app.automation.max-attempts=3
app.automation.max-extra-recipients=10
