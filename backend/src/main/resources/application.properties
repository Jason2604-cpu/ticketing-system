spring.application.name=konoha-helpdesk

# All tunable parameters live in app-config.properties (same folder).
spring.config.import=classpath:app-config.properties

# Database (Postgres) — values come from .env via spring-dotenv, falling back
# to local defaults so the app still boots without a .env present.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:konoha_helpdesk}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP). 10 is plenty for one backend container; Postgres' default
# max_connections is 100, so keep DB_POOL_SIZE x backend replicas well below that.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000

# ── Schema: owned by Flyway ────────────────────────────────────────────────
# Migrations live in src/main/resources/db/migration (V1 = baseline, V2+ = changes) and run on
# startup. A database that Hibernate created before Flyway existed is recorded as V1 on first
# contact (baseline-on-migrate) and then gets V2+. Hibernate only checks that the entities
# match the tables; it never alters them. To change the schema, add V<n+1>__what.sql.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Hibernate performance:
# - batch_fetch_size turns "one SELECT per row" lazy/eager loads of to-one associations into
#   IN (...) batches, which removes the N+1 on every list (tickets, users, templates, audit...).
# - jdbc.batch_size + order_updates batch UPDATE/DELETE statements (INSERTs use IDENTITY ids
#   and cannot be batched by Hibernate).
# - in_clause_parameter_padding keeps IN-list query plans cacheable.
spring.jpa.properties.hibernate.default_batch_fetch_size=64
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# SMTP (only used when app.mail.enabled=true)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
# STARTTLS (port 587) vs implicit SSL (port 465) — set exactly one true via .env.
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
# Some SMTP servers negotiate a TLS 1.3 session that older JavaMail/Jakarta Mail
# builds then stall reading from (looks like a read timeout right after the handshake).
# Pin to 1.2 if that happens; leave blank to let the JVM pick.
spring.mail.properties.mail.smtp.ssl.protocols=${MAIL_SMTP_SSL_PROTOCOLS:TLSv1.2}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
# Set MAIL_DEBUG=true to print the full SMTP/TLS conversation to the console when troubleshooting.
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# Never leak stack traces / exception messages in default error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Don't advertise the container in the Server header.
server.tomcat.server-header=

# Request size guardrails.
server.tomcat.max-http-form-post-size=1MB
# Hard transport cap; the per-type limit is app.media.max-file-size-mb.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Logging: security-relevant events go to the AUDIT logger.
logging.level.AUDIT=INFO
logging.level.com.konohahelpdesk=INFO

# ── Containers / scaling ──────────────────────────────────────────────────
# Where rate-limit and login-lockout counters live: memory (local dev, one backend) or redis
# (Docker default: shared by every backend container and kept across restarts).
app.store.type=${APP_STORE_TYPE:memory}
# Only connected to when app.store.type=redis.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Short timeouts: every /api request consults the rate limiter, and the Redis stores fail open,
# so a hung Redis should cost milliseconds, not seconds.
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
# The app uses StringRedisTemplate only — no Spring Data Redis repositories to scan for.
spring.data.redis.repositories.enabled=false
# @Scheduled sweeps. Keep true on exactly one backend instance (see SchedulingConfig).
app.scheduling.enabled=${SCHEDULING_ENABLED:true}
# Per-instance business-hours cache lifetime (see BusinessCalendar).
app.cache.business-hours-ttl-seconds=${BUSINESS_HOURS_CACHE_TTL_SECONDS:300}

# Finish in-flight requests on `docker compose stop` instead of cutting them off.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Actuator: health only, for the container healthcheck. Never routed by nginx.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# An unreachable SMTP server must not mark the app unhealthy and get the container restarted.
management.health.mail.enabled=false
# Same for Redis: the rate-limit / lockout stores fail open, and the redis container has its own
# healthcheck. (Also keeps /actuator/health green in local dev, where no Redis runs.)
management.health.redis.enabled=false
