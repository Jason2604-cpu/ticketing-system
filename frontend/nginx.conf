# Serves the built SPA inside the frontend container. The edge nginx (../nginx) sits in front
# and does compression, headers and routing; this one only maps URLs to files.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Container healthcheck (docker-compose.yml).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Client-side routes (/admin/assets/…) all load index.html; never cache it, so a deploy is
    # picked up on the next page load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
