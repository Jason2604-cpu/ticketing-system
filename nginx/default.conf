# Edge proxy: the only container with a published port.
#   /api/…  → backend:8080   (Spring Boot)
#   /…      → frontend:80    (built SPA)
# /actuator is deliberately NOT routed — health is for the compose healthchecks only.
# For HTTPS see nginx/https.conf.example and DEPLOYMENT.md step 9.

upstream backend  { server backend:8080;  keepalive 16; }
upstream frontend { server frontend:80;   keepalive 8; }

# Compress text responses (JSON from the API, JS/CSS from the SPA). The main JS bundle goes from
# ~310 kB to ~100 kB on the wire.
gzip on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types application/json application/javascript text/css text/plain text/csv image/svg+xml;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Matches spring.servlet.multipart.max-request-size (30MB) so big attachments reach Spring,
    # which returns a proper error instead of nginx's HTML 413.
    client_max_body_size 30m;

    # Container healthcheck (docker-compose.yml).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        # OVERWRITE, never append: RateLimitFilter trusts the first X-Forwarded-For entry
        # (TRUST_FORWARDED_FOR=true), so a client-supplied value must not survive this hop.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Stream uploads straight to Spring instead of spooling them to disk here first.
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The API sets its own security headers; these cover the SPA's HTML/JS/CSS.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
